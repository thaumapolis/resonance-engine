name: CI

# One job per engine, each running check.sh end to end -- types, the unit and
# wiring tests, and the painted page with that engine's golden frames. There is
# deliberately no second definition of the acceptance checklist here: if the two
# disagree, CI proves something other than what a contributor sees.
#
# The toolchain comes from the pinned flake.lock, so CI and `nix develop` resolve
# the same node, Deno, esbuild, Playwright driver and browser set. That replaces
# `nix-shell shell.nix` plus a `nix-build gcroots.nix` bootstrap whose NIX_PATH
# had to be a tarball URL because a `github:` specifier is split on ':' by
# NIX_PATH -- a trap this flake removes rather than documents around.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.browsers }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Both engines own baselines in tests/golden and they cannot share them:
      # overlapped, the same pose differs between the two in 3.7% (idle) to 32%
      # (chrome) of pixels, so a shared image set would compare nothing.
      fail-fast: false
      matrix:
        browsers: [firefox, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            http2 = false
            fallback = true
      # packages.default is the shipped artifact, so a broken package build has to
      # be a red build. Nothing else would catch it: the checklist runs
      # `nix develop`, which does not build the package at all.
      - name: Build the package and check it matches the committed artifact
        run: |
          # Addressed by store path, not a result symlink: --no-link creates none.
          OUT=$(nix build --no-link --print-out-paths)
          test "$(sha256sum < "$OUT/index.html")" = "$(sha256sum < index.html)"
      - name: Type check, unit tests, painted page
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: nix develop --command ./check.sh
      # A runner paints pixels this machine did not, and a percentage mismatch is
      # unreadable without seeing what it drew. Only on failure, so a green run
      # uploads nothing.
      - name: Upload what the runner painted
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: painted-${{ matrix.browsers }}
          path: .tmp/painted
          if-no-files-found: ignore
          retention-days: 7
